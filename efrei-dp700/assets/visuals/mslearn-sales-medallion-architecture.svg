<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Learn Sales Medallion</title>
  <desc id="desc">Architecture medaillon pour les fichiers sales Microsoft Learn dans Fabric.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#172033">Microsoft Learn Sales : architecture medaillon</text>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="17" fill="#526074">Cas officiel Microsoft Learn : CSV annuels, Delta, schema etoile, SQL endpoint et Power BI</text>

  <rect x="70" y="160" width="190" height="115" rx="14" fill="#ffffff" stroke="#c7d0dc" stroke-width="2"/>
  <text x="165" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">CSV sources</text>
  <text x="165" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526074">2019.csv</text>
  <text x="165" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526074">2020.csv, 2021.csv</text>

  <path d="M270 218 H335" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="345" y="130" width="210" height="175" rx="16" fill="#fff7e6" stroke="#c6811f" stroke-width="2"/>
  <text x="450" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#5a3600">Bronze</text>
  <text x="450" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a3600">Fichiers + table brute</text>
  <rect x="375" y="224" width="150" height="32" rx="7" fill="#ffffff" stroke="#e0ad5f"/>
  <text x="450" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5a3600">bronze_sales_orders</text>

  <path d="M565 218 H630" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="640" y="130" width="210" height="175" rx="16" fill="#eef3f8" stroke="#6c7f95" stroke-width="2"/>
  <text x="745" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#24364a">Silver</text>
  <text x="745" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#24364a">Type, nettoye, enrichi</text>
  <rect x="670" y="224" width="150" height="32" rx="7" fill="#ffffff" stroke="#9baabe"/>
  <text x="745" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#24364a">silver_sales_orders</text>

  <path d="M860 218 H925" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="935" y="130" width="210" height="175" rx="16" fill="#fff5d6" stroke="#c4a000" stroke-width="2"/>
  <text x="1040" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#5a4700">Gold</text>
  <text x="1040" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5a4700">Schema etoile</text>
  <text x="1040" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5a4700">dimdate / dimcustomer</text>
  <text x="1040" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5a4700">dimproduct / factsales</text>

  <rect x="180" y="395" width="225" height="90" rx="14" fill="#ffffff" stroke="#c7d0dc" stroke-width="2"/>
  <text x="292" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Notebook bronze</text>
  <text x="292" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526074">schema explicite</text>

  <rect x="485" y="395" width="225" height="90" rx="14" fill="#ffffff" stroke="#c7d0dc" stroke-width="2"/>
  <text x="597" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Notebook silver</text>
  <text x="597" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526074">revenue + dedup</text>

  <rect x="790" y="395" width="225" height="90" rx="14" fill="#ffffff" stroke="#c7d0dc" stroke-width="2"/>
  <text x="902" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Notebook gold</text>
  <text x="902" y="456" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#526074">dimensions + fact</text>

  <rect x="420" y="525" width="360" height="58" rx="12" fill="#e8f3ff" stroke="#5a9ee6" stroke-width="2"/>
  <text x="600" y="561" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">SQL analytics endpoint + modele semantique Power BI</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#607086"/>
    </marker>
  </defs>
</svg>

